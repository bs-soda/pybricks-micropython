# ISO 29110 — Team Template Manifest (23 Work Products)
# Shipped in soda-os at docs/08-iso29110/
# Template files: docs/08-iso29110/templates/{folder}/{template_file}
# Output files:   work-products/{folder}/WP{nn}-{Basename}.md
#   Basename = template_file without .template.md (e.g. WP02-Agreement.md)
# Agent skill:    .agents/skills/soda-iso29110/SKILL.md
#
# output_type:
#   doc      — full Markdown work product from template
#   link     — thin register pointing at external tool (ClickUp / GitHub / server)
#   register — artifact checklist (repo/build/release), not a long narrative doc
#   derived  — generated from another WP (e.g. WP20 summary/graph from WP19)

version: "1.2"
source: soda-os
templates_root: docs/08-iso29110/templates
output_root: work-products
placeholders_global:
  - project_name
  - project_code
  - project_description
  - objective
  - stakeholders
  - author
  - date
  - client_name
  - vendor_name
  - agreement_id
  - agreement_date
  - project_duration_start
  - project_duration_end
  - communication_methods
  - company_code
  - schedule_link
  - document_link
  - sheet_link
  - repository_url
  - components_repository_url
  - app_store_url
  - production_url
  - product_owner_name
  - test_case_sheet_link
  - project_tool_url
  - change_request_clickup_url
  - correction_register_clickup_url
  - change_request_form_url
  - backup_server
  - backup_path
  - app_package_id
  - release_version
  - release_tag
  - store_submission_status
  - test_report_version
  - test_environment
  - test_period_start
  - test_period_end
  - test_lead

# agent_role: orchestrator | management | requirements | design | qa | cm | ops | deliverables

# Full generation order (docs + link/register/derived). Event-driven WPs separate.
#
# | Gen# | WP   | Name                         | Type     |
# |:----:|:----:| ---------------------------- | -------- |
# |  1   | WP02 | Agreement                    | doc      |
# |  2   | WP10 | Project Plan                 | doc      |
# |  3   | WP13 | Requirement Specification    | doc      |
# |  4   | WP09 | Progress Status Record       | doc      |
# |  5   | WP16 | Software Design              | doc      |
# |  6   | WP15 | Software Components          | link     |
# |  7   | WP05 | Implementation Environment   | doc      |
# |  8   | WP11 | Project Repository           | link     |
# |  9   | WP19 | Test cases and Procedure     | doc      |
# | 10   | WP21 | Traceability Record          | doc      |
# | 11   | WP23 | Verification Record          | doc      |
# | 12   | WP14 | Software                     | register |
# | 13   | WP20 | Test report                  | derived  |
# | 14   | WP22 | Validation Record            | doc      |
# | 15   | WP08 | Product Operation Guideline  | doc      |
# | 16   | WP18 | Software User Document       | doc      |
# | 17   | WP06 | Maintenance Documentation    | doc      |
# | 18   | WP12 | Project Repository Backup    | link     |
# | 19   | WP17 | Software Product             | doc      |
# | 20   | WP01 | Acceptance Record            | doc      |
# |  —   | WP03 | Change Request               | link (event) |
# |  —   | WP04 | Correction Register          | link (event) |
# |  —   | WP07 | Meeting Record               | doc (event) |

generation_order:
  - WP02
  - WP10
  - WP13
  - WP09
  - WP16
  - WP15
  - WP05
  - WP11
  - WP19
  - WP21
  - WP23
  - WP14
  - WP20
  - WP22
  - WP08
  - WP18
  - WP06
  - WP12
  - WP17
  - WP01

generation_order_event_driven:
  - WP03
  - WP07
  - WP04

waves:
  A: [WP02, WP10, WP13]
  B: [WP09, WP16, WP15, WP05, WP11, WP19, WP21, WP23, WP14, WP20]
  C: [WP08, WP18, WP06, WP12, WP17]
  D: [WP22, WP01]
  event: [WP03, WP07, WP04]

work_products:
  - wp_id: WP01
    sw_id: SW01
    generate_sequence: 20
    name: Acceptance Record
    agent_role: cm
    folder: 05_CM_QA
    template_file: Acceptance-Record.template.md
    recipe_id: R-WP01
    output_type: doc
    wave: D
    depends_on: [WP10, WP13, WP19, WP20, WP22]
    notes: "Last — human sign-off; reference passed REQ/F/TC and UAT"

  - wp_id: WP02
    sw_id: SW02
    generate_sequence: 1
    name: Agreement
    agent_role: management
    folder: 01_Management
    template_file: Agreement.template.md
    recipe_id: R-WP02
    output_type: doc
    wave: A
    scope_policy: features_only
    depends_on: []
    notes: "SOW — F-xx only; REQ-xxx in WP13"

  - wp_id: WP03
    sw_id: SW03
    generate_sequence: event
    name: Change Request
    agent_role: cm
    folder: 05_CM_QA
    template_file: Change-Request.template.md
    recipe_id: R-WP03
    output_type: link
    wave: event
    link_field: change_request_clickup_url
    depends_on: [WP10, WP13]
    notes: "ClickUp CR list/form URL — not a long document"

